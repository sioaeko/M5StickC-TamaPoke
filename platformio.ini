[platformio]
default_envs = stickc-plus2
src_dir = ports/stickc-plus2
data_dir = ports/stickc-plus2/data

[env:stickc-plus2]
platform = espressif32@6.12.0
board = m5stick-c
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = ports/stickc-plus2/partitions.csv
board_build.filesystem = littlefs
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    m5stack/M5Unified@0.3.0
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -I .
    -DCORE_DEBUG_LEVEL=1

